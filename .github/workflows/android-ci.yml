name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        # Includes Gradle wrapper validation.
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate feasibility manifest
        run: python3 scripts/check_feasibility_gate.py
      - name: Validate Gradle configuration
        run: ./gradlew --no-daemon --stacktrace help
      - name: Android lint
        run: |
          lint_status=0
          ./gradlew --no-daemon --stacktrace lintDebug || lint_status=$?
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
          exit "$lint_status"
      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Build debug APK and device test APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Upload experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BYGA-Flow-Manager-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload checks and device test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BYGA-Phase0-Test-Reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/androidTest/
          if-no-files-found: warn
      - name: Build summary
        if: always()
        run: |
          echo '### BYGA — single browser / manual account switching' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug APK: organizer metadata only. Choose the active Google account manually in Flow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI does not test Google login or establish session isolation. Review reports and docs/scope-manual-switching.md.' >> "$GITHUB_STEP_SUMMARY"
  android-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android persistence and UI smoke tests (synthetic metadata only)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BYGA-Phase0-Android-Test-Reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
